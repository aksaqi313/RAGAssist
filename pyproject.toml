[project]
name = "rag-assist"
version = "0.1.0"
description = "A RAG-Assist application for document question answering using retrieval-augmented generation."
readme = "README.md"
authors = [
    { name = "Avishek Pal" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
rag-assist = "rag_assist:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
